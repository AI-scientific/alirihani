# Deploys the static site in this repository to GitHub Pages.
# No build step: the repository root (index.html, style.css) is published as-is.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # also allows a manual run from the Actions tab

# Minimum permissions needed by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Run one deployment at a time; let an in-progress deployment finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .           # repository root; .git and .github are excluded automatically

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
